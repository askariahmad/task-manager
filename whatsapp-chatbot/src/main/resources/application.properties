server.port=${PORT:8080}

# Twilio Configuration (placeholders - actual values should be set via environment variables)
# These are here just for completeness, but WhatsAppService uses System.getenv()
twilio.account_sid=${TWILIO_ACCOUNT_SID}
twilio.auth_token=${TWILIO_AUTH_TOKEN}
twilio.phone_number=${TWILIO_PHONE_NUMBER}

# MongoDB Configuration
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/whatsapp_chatbot_db}
# Uses MONGODB_URI env var if set, otherwise defaults to local MongoDB.
